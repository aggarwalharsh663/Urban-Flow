name: Build Windows Deliverables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Setup Executable & Standalone Zip
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies & Build Static Assets
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile C# Launcher, Setup, and Updater
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) {
            $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          Write-Host "Compiling with: $csc"
          & $csc /target:winexe /out:"Urban Flow.exe" launcher.cs
          & $csc /target:winexe /out:"updater.exe" updater.cs

      - name: Build Setup Installer
        shell: powershell
        run: |
          python build_setup_exe.py --rebuild-zip --source="$PWD" --out="$PWD\Urban Flow Setup.exe"

      - name: Build Standalone Zip
        shell: powershell
        run: |
          python make_standalone_zip.py

      - name: Upload Deliverables as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Urban-Flow-Windows-Deliverables
          path: |
            Urban Flow Setup.exe
            Urban-Flow-v1.0-Standalone.zip
          retention-days: 30
