name: Urban Flow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Download YOLO Weights for Testing
        shell: powershell
        run: |
          python -c "import os, urllib.request; os.makedirs('backend', exist_ok=True); urllib.request.urlretrieve('https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt', 'backend/yolov8n.pt') if not os.path.exists('backend/yolov8n.pt') else None"

      - name: Compile Launcher Executable for Testing
        shell: powershell
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /target:winexe /win32manifest:app.manifest /out:"Urban Flow.exe" launcher.cs

      - name: Verify Copyright Headers (100% Policy)
        shell: powershell
        run: |
          python -c "
          import os
          exts = ('.py', '.ts', '.tsx', '.js', '.jsx', '.cs', '.cjs', '.mjs', '.ps1', '.bat')
          missing = []
          for root, dirs, files in os.walk('.'):
              norm = os.path.normpath(root)
              if any(x in norm for x in ['node_modules', '.git', 'backend/python', 'backend\\\\python', 'dist', 'build', '.cache', '.output']):
                  continue
              for f in files:
                  if f.endswith(exts):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          if 'Harsh Aggarwal' not in fp.read(500):
                              missing.append(p)
          if missing:
              print('Files missing copyright header:', missing)
              exit(1)
          print('All source files pass copyright verification.')
          "

      - name: Run Pytest
        shell: powershell
        run: |
          pytest backend/tests -v

  frontend-tests:
    name: Frontend Vitest & Security Suites
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        shell: powershell
        run: |
          npm install

      - name: Run Frontend Tests (Vitest)
        working-directory: frontend
        shell: powershell
        run: |
          npm run test -- --run

      - name: Run Electron Security Tests
        working-directory: frontend
        shell: powershell
        run: |
          node test/electron_security.test.mjs
